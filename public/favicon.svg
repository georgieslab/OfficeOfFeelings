<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Outer official wax seal circle -->
  <circle cx="32" cy="32" r="30" fill="#211d1a" stroke="#d5c3ab" stroke-width="2"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#d5c3ab" stroke-width="1" stroke-dasharray="2 1.5"/>

  <!-- Mural crown (Mauerkrone) -->
  <path d="M24 18 L24 15 L27 16.5 L30 14.5 L34 14.5 L37 16.5 L40 15 L40 18 Z" fill="#eedfcb"/>

  <!-- Austrian Escutcheon (Shield) -->
  <path d="M22 19 H42 V35 C42 43 32 49 32 49 C32 49 22 43 22 35 Z" fill="#b22222" stroke="#d5c3ab" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Austrian central white fess (Bindenschild) -->
  <rect x="22.5" y="25" width="19" height="7" fill="#fbf8f1"/>

  <!-- Crossed Quill Pens -->
  <line x1="16" y1="46" x2="26" y2="38" stroke="#d5c3ab" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="48" y1="46" x2="38" y2="38" stroke="#d5c3ab" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Letters A F G at bottom -->
  <text x="32" y="56" font-family="'Courier New', monospace" font-size="6.5" font-weight="900" fill="#eedfcb" text-anchor="middle" letter-spacing="1">AFG</text>
</svg>
